{% extends "core/base_publica.html" %}
{% load static %}

{% block content %}
<section class="hero">
    <div class="hero-visual">
        <img src="{% static 'img/fitflix-kv.png' %}" alt="FitFlix - Treine, Evolua, Supere. O próximo nível começa aqui." class="hero-kv">
    </div>

    <div class="hero-actions-top">
        {% if not user.is_authenticated %}
            <a href="{% url 'core:login' %}" class="btn btn-primary btn-lg">Entrar</a>
            <a href="{% url 'core:register' %}" class="btn btn-secondary btn-lg">Criar conta</a>
        {% else %}
            <a href="{% url 'core:avaliacoes' %}" class="btn btn-primary btn-lg">Ir para o sistema</a>
        {% endif %}
    </div>
</section>
{% endblock %}
